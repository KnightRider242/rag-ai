[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ai-backend"
version = "0.1.0"
description = "Backend API for the RAG-AI enterprise knowledge assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.120",
    "httpx>=0.27,<1.0",
    "langchain-core>=1.4.7,<2.0",
    "langchain-text-splitters>=1.1,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pymupdf>=1.24,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rag_ai.storage.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
